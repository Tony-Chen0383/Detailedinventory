<!DOCTYPE html>

<head>

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{--navy:#0f2747;--blue:#1d5ca8;--line:#dbe4ef;--text:#172033;--muted:#69778c;--bg:#f4f7fb;--ok:#067647}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text)}

.topbar h1{margin:0;font-size:26px}.topbar p{margin:7px 0 0;color:#dbe8fb;font-size:14px}.wrap{max-width:1500px;margin:22px auto;padding:0 20px 40px}
.panel{background:#fff;border:1px solid #e5ebf3;border-radius:16px;padding:20px;box-shadow:0 7px 24px rgba(31,54,83,.06);margin-bottom:18px}.panel h2{font-size:18px;margin:0 0 14px;color:var(--navy)}

.file-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.drop-zone{border:2px dashed #c8d6e8;border-radius:14px;padding:14px;background:#fbfdff;transition:.18s ease}.drop-zone.dragover{border-color:var(--blue);background:#eef6ff;box-shadow:0 0 0 4px rgba(29,92,168,.08)}.drop-hint{margin-top:9px;color:#7a8799;font-size:12px;text-align:center}.file-picker{height:48px;border:0;border-radius:11px;padding:0 20px;font-size:14px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 12px rgba(29,92,168,.18);transition:.18s ease;margin:0}.file-picker:hover{transform:translateY(-1px);box-shadow:0 7px 16px rgba(29,92,168,.22)}.file-picker:active{transform:translateY(0)}.file-name{height:48px;display:flex;align-items:center;padding:0 14px;border:1px solid #dbe4ef;border-radius:11px;background:#f8fafc;color:#64748b;font-size:13px;min-width:280px;flex:1}.import-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.store-badge{display:inline-flex;align-items:center;gap:7px;background:#eef6ff;border:1px solid #cfe0f5;border-radius:999px;padding:8px 12px;color:#174985;font-size:13px;font-weight:800}
button{height:42px;border:0;border-radius:10px;padding:0 17px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.dark{background:var(--navy);color:#fff}.outline{background:#fff;border:1px solid #bfcbd9;color:#334155}.secondary{background:#eaf1fb;color:#174985}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.setup-flex{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}.setup-left{flex:1 1 720px;min-width:300px}.inline-control{margin-top:14px;padding-top:14px;border-top:1px solid #e5ebf3}.side-control{flex:0 0 430px;min-width:300px;margin-top:0;padding:14px 0 0 16px;border-top:0;border-left:1px solid #e5ebf3;display:flex;flex-direction:column;justify-content:center}.side-control .actions{margin-bottom:8px}.inline-control .hint{margin:8px 0 0}.status{margin-top:12px;padding:11px 13px;border-radius:10px;background:#f8fafc;border:1px solid #e5e7eb;color:#64748b;font-size:13px}.status.ok{background:#ecfdf5;color:#067647;border-color:#abefc6}.status.err{background:#fef3f2;color:#b42318;border-color:#fecdca}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kpi{padding:16px;border-radius:13px;background:#f8fbff;border:1px solid #deebfa}.kpi span{font-size:12px;color:#728197}.kpi b{display:block;font-size:24px;color:var(--navy);margin-top:6px}

.category-panel{display:none}.category-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.category-head h2{margin:0}.category-count{font-size:12px;color:#64748b}.category-select-wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.category-select-wrap label{margin:0;font-size:13px}.category-select{width:min(460px,100%);height:44px;border:1px solid #cfd9e6;border-radius:10px;padding:0 38px 0 12px;background:#fff;color:#172033;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer}
.checkline{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.checkline label{display:flex;align-items:center;gap:7px;margin:0;font-size:13px;color:#46556a}.hint{font-size:12px;color:#6b7280;line-height:1.7}
.tablewrap{overflow:auto;border:1px solid #dde5ef;border-radius:12px;max-height:62vh}.tablewrap table{width:100%;border-collapse:separate;border-spacing:0;min-width:900px;font-size:16px}.tablewrap th{position:sticky;top:0;background:var(--navy);color:#fff;padding:9px 4px;text-align:center;white-space:nowrap;z-index:1;font-size:16px;font-weight:800}.tablewrap td{border-bottom:1px solid #edf1f6;border-right:1px solid #f1f4f8;padding:8px 4px;text-align:center;vertical-align:middle;font-size:16px;font-weight:700;line-height:1.15}.tablewrap tbody tr:nth-child(even){background:#fafcff}.tablewrap td.model,.tablewrap td.note{text-align:left;white-space:normal;word-break:break-word;overflow:visible;text-overflow:clip;min-width:360px}.tablewrap td.special{width:4.4em;min-width:4.4em;max-width:4.4em;white-space:nowrap}.tablewrap td.grade{white-space:nowrap;word-break:keep-all;line-height:1.15;padding-top:6px;padding-bottom:6px;padding-left:1px;padding-right:1px;text-align:center!important;vertical-align:middle;font-size:15px}.tablewrap th:nth-child(3),.tablewrap td:nth-child(3){width:6.4ch;min-width:6.4ch;max-width:6.4ch;padding-left:2px;padding-right:2px}.tablewrap th:nth-child(4),.tablewrap td:nth-child(4){width:4.8em;min-width:4.8em;max-width:4.8em;padding-left:1px;padding-right:1px}.tablewrap th:nth-child(5),.tablewrap td:nth-child(5){width:4.4em;min-width:4.4em;max-width:4.4em;padding-left:2px;padding-right:2px}.tablewrap th:nth-child(6),.tablewrap td:nth-child(6){width:5.4em;min-width:5.4em;max-width:5.4em;padding-left:3px;padding-right:3px;white-space:nowrap}.tablewrap td.imei{font-family:Consolas,monospace;white-space:nowrap;width:6.4ch;min-width:6.4ch;max-width:6.4ch;padding-left:2px;padding-right:2px;font-weight:700}.check-box{font-size:15px!important;line-height:1;font-weight:400!important;padding-left:2px!important;padding-right:2px!important}.empty{padding:48px 20px!important;color:#94a3b8;text-align:center!important}
.print-title,.print-meta,.print-signatures{display:none}.print-signatures{margin:10px 0 14px;gap:28px;justify-content:space-between;font-size:11pt;font-weight:700}.print-signatures span{flex:1;border:1.5px solid #94a3b8;border-radius:8px;padding:14px 12px 12px;min-height:60px;background:#fff;display:flex;align-items:flex-start}@media(max-width:900px){.grid,.summary{grid-template-columns:1fr 1fr}.side-control{flex-basis:100%;min-width:0;padding:14px 0 0;border-left:0;border-top:1px solid #e5ebf3}}@media(max-width:560px){.grid,.summary{grid-template-columns:1fr}.wrap{padding:0 10px}.topbar{padding:18px}.setup-flex{gap:12px}.file-name{min-width:0;width:100%}.side-control{padding-top:12px}}
@media print{@page{size:A4 portrait;margin:5mm 6mm}body{background:#fff}.topbar,.no-print,.setup,.summaryPanel,.category-panel{display:none!important}.wrap{max-width:none;margin:0;padding:0}.panel{box-shadow:none;border:0;padding:0;margin:0}.preview h2{display:none}.print-title{display:block!important;text-align:center;font-size:13pt;font-weight:800;margin-bottom:2px}.print-meta{display:flex!important;justify-content:space-between;font-size:8pt;margin-bottom:3px}.print-signatures{display:flex!important;margin:3px 0 4px;gap:10px}.print-signatures span{border:1px solid #555!important;border-radius:0!important;padding:5px 5px!important;min-height:28px!important;font-size:8.5pt!important}.tablewrap{overflow:visible;max-height:none;border:0}.tablewrap table{min-width:0;font-size:8.5pt;table-layout:fixed;border-collapse:collapse}.tablewrap th{position:static;background:#dbe7f6!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-weight:800}.tablewrap th,.tablewrap td{padding:2px 1px;border:1px solid #777;word-break:normal;font-size:8.5pt;font-weight:700;line-height:1.15;height:auto;min-height:18px;vertical-align:middle}.tablewrap td.model,.tablewrap td.note{min-width:0;white-space:normal;word-break:break-word;overflow:visible;text-overflow:clip}.tablewrap td.special{white-space:nowrap}.tablewrap td.grade{white-space:nowrap;word-break:keep-all;line-height:1.15;padding-top:2px;padding-bottom:2px;padding-left:1px;padding-right:1px;text-align:center!important;vertical-align:middle;font-size:8.2pt}.tablewrap th:nth-child(1),.tablewrap td:nth-child(1){width:5%}.tablewrap th:nth-child(2),.tablewrap td:nth-child(2){width:59.5%}.tablewrap th:nth-child(3),.tablewrap td:nth-child(3){width:8%}.tablewrap th:nth-child(4),.tablewrap td:nth-child(4){width:5.5%}.tablewrap th:nth-child(5),.tablewrap td:nth-child(5){width:5%}.tablewrap th:nth-child(6),.tablewrap td:nth-child(6){width:8%}.tablewrap th:nth-child(7),.tablewrap td:nth-child(7){width:9%}}

.print-pages{display:none}
@media print{
  @page{size:A4 portrait;margin:4mm 5mm}
  .preview{display:none!important}
  .print-pages{display:block!important}
  .print-page{page-break-after:always;break-after:page;min-height:289mm;display:flex;flex-direction:column}
  .print-page:last-child{page-break-after:auto;break-after:auto}
  .print-page-title{text-align:center;font-size:11.5pt;font-weight:800;margin:0 0 1px}
  .print-page-meta{display:flex;justify-content:space-between;font-size:7.2pt;font-weight:700;margin:0 0 2px}
  .print-page-signatures{display:flex;gap:8px;margin:3mm 0 0;font-size:9.5pt;font-weight:800;flex:0 0 auto}
  .print-page-signatures span{flex:1;border:1.2px solid #444;padding:5px 6px;min-height:25mm;display:flex;align-items:flex-start}
  .print-page table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:7.5pt;flex:1}
  .print-page th,.print-page td{border:1px solid #777;padding:.5px 1px;font-size:7.5pt;font-weight:700;line-height:1.02;vertical-align:middle}.print-page tbody tr{height:var(--row-h,5.1mm)}
  .print-page th{background:#dbe7f6!important;color:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;text-align:center;font-weight:800;white-space:nowrap}
  .print-page td{text-align:center}
  .print-page td.model{text-align:left;white-space:normal;word-break:break-word}
  .print-page td.imei,.print-page td.grade,.print-page td.special,.print-page td.price,.print-page td.check{white-space:nowrap}
  .print-page tr{page-break-inside:avoid;break-inside:avoid}
  .print-page th:nth-child(1),.print-page td:nth-child(1){width:4%}
  .print-page th:nth-child(2),.print-page td:nth-child(2){width:64%}
  .print-page th:nth-child(3),.print-page td:nth-child(3){width:7%}
  .print-page th:nth-child(4),.print-page td:nth-child(4){width:5%}
  .print-page th:nth-child(5),.print-page td:nth-child(5){width:5%}
  .print-page th:nth-child(6),.print-page td:nth-child(6){width:7%}
  .print-page th:nth-child(7),.print-page td:nth-child(7){width:8%}
}
</style>

<body>
<div class="topbar"><h1>二手機盤點格式轉換工具 <small style="font-size:13px;opacity:.75">V2.23</small></h1><p>公司二手機回收紀錄 Excel → 自動辨識欄位 → 固定盤點格式 → 直接列印盤點</p></div>
<div class="wrap">
<section class="panel setup"><h2>① 匯入 Excel／門市盤點</h2><div class="setup-flex"><div class="setup-left"><div id="dropZone" class="drop-zone"><div class="import-row"><input id="fileInput" class="file-input" type="file" accept=".xlsx" /><label for="fileInput" class="file-picker">選擇 Excel 檔案</label><div id="fileName" class="file-name">尚未選擇檔案</div><button id="resetBtn" class="outline">清除</button></div><div class="drop-hint">也可以直接將 Excel 檔案拖曳到這個區域，放開後會自動讀取</div></div></div><div id="controlPanel" class="inline-control side-control" style="display:none"><div class="actions"><div id="boundStore" class="store-badge">門市：—</div><button id="printBtn" class="secondary">列印盤點表</button></div><p class="hint">匯入後會自動綁定檔案中的門市，不需要再選擇。</p></div></div><div id="status" class="status">選擇或拖曳 Excel 後會自動讀取資料並綁定門市。</div></section>
<section class="panel summaryPanel" id="summaryPanel" style="display:none"><div class="summary"><div class="kpi"><span>目前盤點筆數</span><b id="kpiRows">0</b></div><div class="kpi"><span>目前門市</span><b id="kpiStore" style="font-size:18px">全部</b></div><div class="kpi"><span>資料更新時間</span><b id="kpiTime" style="font-size:18px">—</b></div></div></section>
<section class="panel category-panel" id="categoryPanel"><div class="category-head"><h2>② 商品分類</h2><span id="categoryCount" class="category-count">全部</span></div><div class="category-select-wrap"><label for="categorySelect">盤點分類</label><select id="categorySelect" class="category-select"><option value="全部">全部商品</option><option value="智慧型手機">智慧型手機</option><option value="智慧型平板">智慧型平板</option><option value="筆電/電腦">筆電 / 電腦</option><option value="穿戴/藍牙">藍芽喇叭 / 藍芽耳機 / 智慧手錶 / 智慧手環</option><option value="其他">其他</option></select></div></section>
<section class="panel preview" id="previewPanel" style="display:none"><div class="print-title">二手機細盤點表</div><div class="print-meta"><span id="printStore">門市：全部</span><span id="printDate"></span></div><h2>③ 盤點格式預覽</h2><div class="tablewrap"><table id="previewTable"><thead></thead><tbody></tbody></table></div></section>
<div id="printPages" class="print-pages"></div>
</div>
<script>
const REQUIRED={category:'商品小類',model:'回收機款',imei:'IMEI',grade:'等級',store:'所在門市',status:'機款狀態',version:'國際版本',burn:'螢幕烙印',price:'設定售價'};
const OUT=['序號','回收機款','IMEI / SN','等級','國 / 烙','售價','盤點確認'];
let sourceWB=null, sourceWS=null, rows=[], filtered=[], storeRows=[];let exportTime='',boundStore='',selectedCategory='全部';
const $=id=>document.getElementById(id);const text=v=>{if(v==null)return'';if(typeof v==='object'){if(v.text!=null)return String(v.text);if(v.result!=null)return String(v.result);if(v.richText)return v.richText.map(x=>x.text).join('')}return String(v)};
const norm=s=>String(s??'').toLowerCase().replace(/[\s_\-\/\\()（）:：]/g,'');const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function setStatus(m,t=''){const e=$('status');e.textContent=m;e.className='status '+t}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function safe(s){return String(s).replace(/[\\/:*?"<>|]/g,'_')}
async function handleFile(f){if(!f)return;if(!/\.xlsx$/i.test(f.name)){setStatus('請匯入 .xlsx 格式的 Excel 檔案。','err');return}try{$('fileName').textContent=f.name;setStatus('正在讀取 Excel 並綁定門市…');sourceWB=new ExcelJS.Workbook();await sourceWB.xlsx.load(await f.arrayBuffer());sourceWS=sourceWB.worksheets.find(ws=>{for(let r=1;r<=Math.min(15,ws.rowCount);r++){const a=ws.getRow(r).values.slice(1).map(v=>text(v).trim());if(a.includes('回收機款')&&a.includes('IMEI')&&a.includes('所在門市'))return true}return false})||sourceWB.worksheets[0];if(!sourceWS)throw new Error('Excel 內沒有可讀取的工作表');parseSheet(sourceWS)}catch(err){console.error(err);setStatus('Excel 讀取失敗：'+err.message,'err')}}
$('fileInput').addEventListener('change',e=>handleFile(e.target.files[0]));const dropZone=$('dropZone');['dragenter','dragover'].forEach(evt=>dropZone.addEventListener(evt,e=>{e.preventDefault();e.stopPropagation();dropZone.classList.add('dragover')}));['dragleave','dragend'].forEach(evt=>dropZone.addEventListener(evt,e=>{e.preventDefault();e.stopPropagation();dropZone.classList.remove('dragover')}));dropZone.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();dropZone.classList.remove('dragover');const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)handleFile(f)});$('resetBtn').addEventListener('click',()=>location.reload());
function parseSheet(ws){let headerRow=-1,headers=[];for(let r=1;r<=Math.min(15,ws.rowCount);r++){const a=ws.getRow(r).values.slice(1).map(v=>text(v).trim());if(a.includes('回收機款')&&a.includes('IMEI')&&a.includes('所在門市')){headerRow=r;headers=a;break}}if(headerRow<0){setStatus('找不到公司標準欄位（回收機款 / IMEI / 所在門市），請確認匯入檔案。','err');return}const idx={};Object.entries(REQUIRED).forEach(([k,h])=>idx[k]=headers.findIndex(x=>norm(x)===norm(h)));rows=[];for(let r=headerRow+1;r<=ws.rowCount;r++){const a=ws.getRow(r).values.slice(1).map(v=>text(v).trim());if(!a.some(Boolean))continue;const g=k=>idx[k]>=0?(a[idx[k]]||''):'';rows.push({category:g('category'),model:g('model'),imei:g('imei'),grade:g('grade'),store:g('store'),status:g('status'),version:g('version'),burn:g('burn'),price:g('price')})}const stores=[...new Set(rows.map(r=>r.store).filter(Boolean))];if(stores.length===0){setStatus('資料中找不到「所在門市」，無法綁定盤點門市。','err');return}if(stores.length>1){setStatus(`此檔案包含 ${stores.length} 間門市，請匯入單一門市的庫存 Excel。`,'err');return}boundStore=stores[0];storeRows=rows.filter(r=>r.store===boundStore).sort((a,b)=>a.model.localeCompare(b.model,'en',{numeric:true,sensitivity:'base'}));selectedCategory='全部';filtered=[...storeRows];const first=ws.getRow(1).values.slice(1).map(text);exportTime=(first.find(x=>x.includes('匯出時間'))||'').replace('匯出時間：','').trim();$('controlPanel').style.display='flex';$('summaryPanel').style.display='block';$('categoryPanel').style.display='block';$('previewPanel').style.display='block';$('boundStore').textContent='門市：'+boundStore;$('kpiStore').textContent=boundStore;$('kpiTime').textContent=exportTime||'—';$('printStore').textContent='門市：'+boundStore;$('printDate').textContent='盤點日期：'+today();$('categorySelect').value='全部';applyCategory();setStatus(`讀取完成：已自動綁定 ${boundStore}，共 ${storeRows.length.toLocaleString()} 筆資料。`,'ok')}
function categoryGroup(category){const c=String(category||'').trim();if(c==='智慧型手機')return '智慧型手機';if(c==='智慧型平板')return '智慧型平板';if(c==='筆電' || c==='電腦' || c==='筆電/電腦' || c==='筆電／電腦')return '筆電/電腦';if(['藍芽喇叭','藍牙喇叭','藍芽耳機','藍牙耳機','智慧手錶','智慧手環'].includes(c))return '穿戴/藍牙';return '其他'}
function categoryLabel(v){return ({'全部':'全部商品','智慧型手機':'智慧型手機','智慧型平板':'智慧型平板','筆電/電腦':'筆電 / 電腦','穿戴/藍牙':'藍芽喇叭 / 藍芽耳機 / 智慧手錶 / 智慧手環','其他':'其他'})[v]||v}
function applyCategory(){filtered=(selectedCategory==='全部'?storeRows:storeRows.filter(r=>categoryGroup(r.category)===selectedCategory)).slice().sort((a,b)=>a.model.localeCompare(b.model,'en',{numeric:true,sensitivity:'base'}));$('kpiRows').textContent=filtered.length.toLocaleString();$('categoryCount').textContent=`${categoryLabel(selectedCategory)}｜${filtered.length.toLocaleString()} 筆`;$('printStore').textContent='門市：'+boundStore+(selectedCategory!=='全部'?`｜分類：${categoryLabel(selectedCategory)}`:'');render()}
$('categorySelect').addEventListener('change',e=>{selectedCategory=e.target.value;applyCategory()});
function last6(v){const x=String(v??'').replace(/\s+/g,'');return x.length<=6?x:x.slice(-6)}
function specialInfo(r){const a=[];const v=String(r.version||'').trim();const b=String(r.burn||'').trim();if(v && v!=='台版')a.push(v.charAt(0));if(b && b!=='無烙印')a.push(b.charAt(0));return a.join(' / ')}
function priceValue(v){const n=Number(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:0}
function priceText(v){return priceValue(v).toLocaleString('zh-TW')}
function render(){const th=$('previewTable').querySelector('thead'),tb=$('previewTable').querySelector('tbody');th.innerHTML='<tr>'+OUT.map(x=>`<th>${x}</th>`).join('')+'</tr>';tb.innerHTML='';if(!filtered.length){tb.innerHTML='<tr><td colspan="7" class="empty">目前沒有符合條件的資料</td></tr>';renderPrintPages();return}filtered.forEach((r,i)=>{const tr=document.createElement('tr');[i+1,r.model,last6(r.imei),r.grade,specialInfo(r),priceText(r.price),'☐'].forEach((v,ci)=>{const td=document.createElement('td');td.textContent=v;if(ci===1)td.className='model';if(ci===2)td.className='imei';if(ci===3)td.className='grade';if(ci===4)td.className='special';if(ci===6)td.className='check-box';tr.appendChild(td)});tb.appendChild(tr)});renderPrintPages()}
function renderPrintPages(){const root=$('printPages');root.innerHTML='';if(!filtered.length)return;const pageSize=50,totalPages=Math.ceil(filtered.length/pageSize);for(let start=0;start<filtered.length;start+=pageSize){const chunk=filtered.slice(start,start+pageSize),page=document.createElement('section');page.className='print-page';const pageNo=Math.floor(start/pageSize)+1,isLast=pageNo===totalPages;const categoryText=selectedCategory!=='全部'?`｜分類：${categoryLabel(selectedCategory)}`:'';const usableMm=isLast?238:264;const rawRowMm=usableMm/Math.max(chunk.length,1);const rowMm=Math.max(4.6,Math.min(9.2,rawRowMm));page.style.setProperty('--row-h',rowMm.toFixed(2)+'mm');page.innerHTML=`<div class="print-page-title">二手機細盤點表</div><div class="print-page-meta"><span>門市：${esc(boundStore)}${esc(categoryText)}</span><span>盤點日期：${today()}｜第 ${pageNo} / ${totalPages} 頁</span></div><table><thead><tr>${OUT.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody></tbody></table>${isLast?'<div class="print-page-signatures"><span>Apple 盤點人員：</span><span>Android 盤點人員：</span></div>':''}`;const body=page.querySelector('tbody');chunk.forEach((r,j)=>{const tr=document.createElement('tr');const vals=[start+j+1,r.model,last6(r.imei),r.grade,specialInfo(r),priceText(r.price),'☐'];vals.forEach((v,ci)=>{const td=document.createElement('td');td.textContent=v;td.className=ci===1?'model':ci===2?'imei':ci===3?'grade':ci===4?'special':ci===5?'price':ci===6?'check':'';tr.appendChild(td)});body.appendChild(tr)});root.appendChild(page)}}
$('printBtn').addEventListener('click',()=>{renderPrintPages();window.print()});
</script>
</body></html>
